<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
<style>
html,body{margin:0;padding:0;background:var(--surface-page,#fff)}
.page{box-sizing:border-box;width:960px;padding:40px 96px;background:var(--surface-page,#fff);color:var(--ink,#3c3836);font-family:var(--font-sans,Lato,Calibri,Arial,sans-serif);font-size:14.67px;line-height:1.25}
.eyebrow{margin:0;font-weight:700;color:var(--accent,#af3a03);font-size:14.67px}
.title{margin:6px 0 0;font-family:var(--font-serif,Georgia,serif);font-weight:700;font-size:45.33px;line-height:1.2}
.sub{margin:6px 0 0;font-family:var(--font-serif,Georgia,serif);font-size:21.33px;line-height:1.2;color:var(--ink-muted,#7c6f64)}
.rule{margin:13.33px 0 40px;height:0;border:0;border-top:2px solid var(--accent,#af3a03)}
.field{margin:0 0 9.33px}.field b{color:var(--accent,#af3a03)}
table{border-collapse:collapse;width:100%}
th{background:var(--table-header,#ebdbb2);text-align:left;font-weight:700;padding:6px 8px;border:.67px solid var(--table-rule,#d5c4a1)}
td{padding:6px 8px;border:.67px solid var(--table-rule,#d5c4a1);vertical-align:top}
td:first-child{font-weight:700;width:48px}td:nth-child(2){width:80px}
</style>
</head>
<body>
<div class="page" style="padding-top:24px;padding-bottom:24px">
<table><tr><th>Nº</th><th>Tiempo</th><th>Descripción</th></tr>
<tr><td>1</td><td>0 s - 3 s</td><td>Plano general del escenario con las tres piezas.</td></tr>
<tr><td>2</td><td>3 s - 6 s</td><td>Travelling lento hacia la primera pieza.</td></tr>
<tr><td>3</td><td>6 s - 8 s</td><td>Corte a negro y créditos, sin título.</td></tr></table>
</div>
</body>
</html>
