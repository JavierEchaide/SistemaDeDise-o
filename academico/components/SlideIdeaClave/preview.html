<!-- @dsCard group="Presentaciones" height=540 width=960 subtitle="Idea clave: una sola frase con una palabra en acento" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
<style>
html,body{margin:0;padding:0;background:var(--surface-slide,#fbf1c7)}
.s{position:relative;width:960px;height:540px;overflow:hidden;font-family:var(--font-sans,Lato,Calibri,Arial,sans-serif)}
.cr{background:var(--surface-slide,#fbf1c7);color:var(--ink,#3c3836)}
.ti{background:var(--surface-ink,#3c3836);color:var(--text-on-ink,#fbf1c7)}
.ft{position:absolute;left:56px;right:56px;bottom:24px;display:flex;justify-content:space-between;font-size:18px;line-height:22px}
.cr .ft{color:var(--ink-muted-slide,#665c54)}.ti .ft{color:var(--text-muted-on-ink,#d5c4a1)}
.g{position:absolute;margin:0;left:56px;top:64px;font-family:var(--font-serif,Georgia,serif);font-weight:700;font-size:40px;line-height:1.12}
.g.d{font-size:56px;line-height:1.1}
.cr .g{color:var(--ink,#3c3836)}.ti .g{color:var(--text-on-ink,#fbf1c7)}
.acc{color:var(--accent,#af3a03)}.ti .acc{color:var(--accent-on-ink,#fe8019)}
.p{position:absolute;margin:0;font-size:24px;line-height:1.35}
.sm{position:absolute;margin:0;font-size:18px;line-height:1.35}
.im{position:absolute;display:flex;align-items:flex-end;padding:14px;box-sizing:border-box;font-size:18px;line-height:1.3;background:var(--table-header,#ebdbb2);color:var(--ink-muted-slide,#665c54)}
.ti .im{background:var(--surface-ink-raised,#504945);color:var(--text-muted-on-ink,#d5c4a1)}
.row{position:absolute;left:480px;width:424px;border-top:1px solid var(--table-rule,#d5c4a1);display:flex;gap:16px;padding-top:16px}
.row b{font-family:var(--font-serif,Georgia,serif);font-size:40px;line-height:1.1;color:var(--accent,#af3a03);width:64px}
.row span{font-size:24px;line-height:1.35}
table{border-collapse:collapse;position:absolute;left:56px;top:196px;width:560px}
th{background:var(--table-header,#ebdbb2);text-align:left;padding:10px 14px;font-weight:700;font-size:18px}
td{padding:12px 14px;border-bottom:1px solid var(--table-rule,#d5c4a1);font-size:24px}
.band{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--surface-ink,#3c3836);display:flex;align-items:center;justify-content:space-between;padding:0 56px;box-sizing:border-box}
.band h2{margin:0;font-family:var(--font-serif,Georgia,serif);font-weight:700;font-size:40px;line-height:1.12;color:var(--text-on-ink,#fbf1c7)}
.band span{font-size:18px;color:var(--text-muted-on-ink,#d5c4a1)}

</head>
<body>
<div class="s cr">
<h2 class="g d" style="width:848px">Un nodo de Blender es <span class="acc">una función</span>: entra un valor, sale otro</h2>
<div class="ft"><span>Javier Echaide</span><span>7</span></div>
</div>
</body>
</html>
